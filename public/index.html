<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온라인 실시간 가격 비교</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-6">
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-blue-600 mb-4">온라인 실시간 가격 비교</h1>
      
      <!-- 상세 검색 지원 폼 -->
      <form onsubmit="searchProducts(event)" class="bg-white p-5 rounded-2xl shadow-md border border-gray-100 max-w-2xl mx-auto space-y-4">
        <!-- 기본 검색 입력 영역 -->
        <div class="flex gap-2">
          <div class="relative flex-1">
            <input 
              type="text" 
              id="searchInput" 
              placeholder="검색어를 입력하세요 (예: 삼다수, 커피, 루나 x2)" 
              class="w-full p-3 pl-4 border rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800"
              required
            >
          </div>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-7 py-3 rounded-xl font-bold transition shadow-sm flex items-center gap-2 whitespace-nowrap">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            검색
          </button>
        </div>

        <!-- 상세 필터 영역 (가격 범위 & 용량/단위) -->
        <div class="pt-3 border-t border-gray-100">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-1">
              <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
              상세 조건 필터
            </span>
            <button type="button" onclick="resetFilters()" class="text-xs text-gray-400 hover:text-gray-600 underline">필터 초기화</button>
          </div>
          
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label for="minPrice" class="block text-xs font-semibold text-gray-600 mb-1 text-left">최저 가격</label>
              <div class="relative">
                <input 
                  type="number" 
                  id="minPrice" 
                  placeholder="0" 
                  min="0"
                  class="w-full p-2.5 pr-8 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 focus:bg-white transition"
                >
                <span class="absolute right-2.5 top-2.5 text-xs text-gray-400">원</span>
              </div>
            </div>
            <div>
              <label for="maxPrice" class="block text-xs font-semibold text-gray-600 mb-1 text-left">최고 가격</label>
              <div class="relative">
                <input 
                  type="number" 
                  id="maxPrice" 
                  placeholder="제한 없음" 
                  min="0"
                  class="w-full p-2.5 pr-8 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 focus:bg-white transition"
                >
                <span class="absolute right-2.5 top-2.5 text-xs text-gray-400">원</span>
              </div>
            </div>
             <div>
              <label for="volume" class="block text-xs font-semibold text-gray-600 mb-1 text-left">용량/단위 필터</label>
              <div class="flex gap-1">
                <input 
                  type="text" 
                  id="volume" 
                  placeholder="예: 500ml, 1kg" 
                  class="flex-1 p-2.5 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 focus:bg-white transition"
                >
                <select id="volumeOp" class="p-2.5 text-xs border rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 font-semibold text-gray-600">
                  <option value="gte">이상</option>
                  <option value="lte">이하</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </form>
    </header>

    <div id="loading" class="hidden text-center py-10">
      <p class="text-lg text-gray-600 animate-pulse">실시간 가격 수집 중...</p>
    </div>

    <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>

  <script>
    function resetFilters() {
      document.getElementById('minPrice').value = '';
      document.getElementById('maxPrice').value = '';
      document.getElementById('volume').value = '';
    }

    async function searchProducts(e) {
      if (e) e.preventDefault();

      const keyword = document.getElementById('searchInput').value.trim();
      if (!keyword) return alert('검색어를 입력하세요.');

      const minPrice = document.getElementById('minPrice').value.trim();
      const maxPrice = document.getElementById('maxPrice').value.trim();
      const volume = document.getElementById('volume').value.trim();
      const volumeOp = document.getElementById('volumeOp').value;

      const resultsDiv = document.getElementById('results');
      const loadingDiv = document.getElementById('loading');

      resultsDiv.innerHTML = '';
      loadingDiv.classList.remove('hidden');

      try {
        const queryParams = new URLSearchParams({ keyword });
        if (minPrice) queryParams.append('minPrice', minPrice);
        if (maxPrice) queryParams.append('maxPrice', maxPrice);
        if (volume) {
          queryParams.append('volume', volume);
          queryParams.append('volumeOp', volumeOp);
        }

        const res = await fetch(`/api/search?${queryParams.toString()}`);
        const data = await res.json();
        loadingDiv.classList.add('hidden');

        if (!data || data.length === 0) {
          resultsDiv.innerHTML = '<p class="col-span-2 text-center text-gray-500">검색 결과가 없습니다.</p>';
          return;
        }

        resultsDiv.innerHTML = data.map(item => `
          <div class="bg-white p-4 rounded-xl shadow flex gap-4 items-center">
            <img src="${item.image}" alt="" class="w-24 h-24 object-contain rounded">
            <div class="flex-1">
              <span class="inline-block ${item.source === '다나와' ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'} text-xs px-2 py-1 rounded font-semibold mb-1">${item.source}</span>
              <h2 class="font-bold text-gray-800 line-clamp-2">${item.title}</h2>
              <p class="text-red-600 font-extrabold text-lg mt-1">${item.price.toLocaleString()} 원</p>
              <a href="${item.link}" target="_blank" class="inline-block mt-2 text-xs text-blue-500 hover:underline">상세보기 &rarr;</a>
            </div>
          </div>
        `).join('');
      } catch (err) {
        loadingDiv.classList.add('hidden');
        alert('데이터 수집 중 오류가 발생했습니다.');
      }
    }
  </script>
</body>
</html>

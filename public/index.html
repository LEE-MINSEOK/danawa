<!-- public/index.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가격 비교</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-6">
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-blue-600 mb-4">실시간 가격 비교</h1>
      <form onsubmit="searchProducts(event)" class="bg-white p-5 rounded-2xl shadow-md border border-gray-100 max-w-2xl mx-auto space-y-4">
        <div class="flex gap-2">
          <input type="text" id="searchInput" placeholder="검색어 입력 (예: 삼다수)" class="w-full p-3 pl-4 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-7 py-3 rounded-xl font-bold whitespace-nowrap">검색</button>
        </div>
        <div class="pt-3 border-t border-gray-100 grid grid-cols-1 sm:grid-cols-3 gap-3 text-left">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">최저가</label>
            <input type="number" id="minPrice" placeholder="0" min="0" class="w-full p-2.5 text-sm border rounded-lg bg-gray-50">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">최고가</label>
            <input type="number" id="maxPrice" placeholder="제한 없음" min="0" class="w-full p-2.5 text-sm border rounded-lg bg-gray-50">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">용량/단위</label>
            <div class="flex gap-1">
              <input type="text" id="volume" placeholder="예: 500ml" class="flex-1 p-2.5 text-sm border rounded-lg bg-gray-50">
              <select id="volumeOp" class="p-2.5 text-xs border rounded-lg bg-gray-50 font-semibold text-gray-600">
                <option value="gte">이상</option>
                <option value="lte">이하</option>
              </select>
            </div>
          </div>
        </div>
      </form>
    </header>
    <div id="loading" class="hidden text-center py-10"><p class="text-gray-600 animate-pulse">수집 중...</p></div>
    <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>
  <script>
    async function searchProducts(e) {
      if (e) e.preventDefault();
      const keyword = document.getElementById('searchInput').value.trim();
      if (!keyword) return;
      const params = new URLSearchParams({
        keyword,
        minPrice: document.getElementById('minPrice').value.trim(),
        maxPrice: document.getElementById('maxPrice').value.trim(),
        volume: document.getElementById('volume').value.trim(),
        volumeOp: document.getElementById('volumeOp').value
      });
      const resultsDiv = document.getElementById('results');
      const loadingDiv = document.getElementById('loading');
      resultsDiv.innerHTML = '';
      loadingDiv.classList.remove('hidden');
      try {
        const res = await fetch(`/api/search?${params}`);
        const data = await res.json();
        loadingDiv.classList.add('hidden');
        if (!data.length) {
          resultsDiv.innerHTML = '<p class="col-span-2 text-center text-gray-500">결과 없음</p>';
          return;
        }
        resultsDiv.innerHTML = data.map(item => `
          <div class="bg-white p-4 rounded-xl shadow flex gap-4 items-center">
            <img src="${item.image}" class="w-24 h-24 object-contain rounded" onerror="this.src='' ">
            <div class="flex-1">
              <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-semibold">${item.source}</span>
              <h2 class="font-bold text-gray-800 line-clamp-2 mt-1">${item.title}</h2>
              <p class="text-red-600 font-extrabold text-lg mt-1">${item.price.toLocaleString()} 원</p>
              <a href="${item.link}" target="_blank" class="text-xs text-blue-500 hover:underline mt-2 inline-block">상세보기 &rarr;</a>
            </div>
          </div>
        `).join('');
      } catch {
        loadingDiv.classList.add('hidden');
        alert('오류 발생');
      }
    }
  </script>
</body>
</html>
